<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>客户管理 - CRM迷你版</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    .header { padding: 15px; background: #f5f5f5; display: flex; justify-content: space-between; align-items: center; }
    .btn { padding: 8px 16px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
    .container { padding: 20px; }
    .filter { margin-bottom: 20px; display: flex; gap: 10px; align-items: center; }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 12px; text-align: left; border-bottom: 1px solid #eee; }
    th { background: #f9f9f9; }
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 100; }
    .modal-content { width: 400px; margin: 100px auto; background: white; padding: 20px; border-radius: 8px; }
    .form-item { margin: 15px 0; }
    input, select { width: 100%; padding: 8px; box-sizing: border-box; }
    .btn-group { display: flex; gap: 10px; margin-top: 20px; }
    .btn-cancel { background: #6c757d; }
  </style>
</head>
<body>
  <div class="header">
    <h1>客户管理系统</h1>
    <span id="username"></span>
  </div>

  <div class="container">
    <div class="filter">
      <select id="statusFilter">
        <option value="">全部状态</option>
        <option value="active">活跃客户</option>
        <option value="inactive">非活跃客户</option>
      </select>
      <button class="btn" onclick="openAddModal()">新增客户</button>
      <a href="report.html" class="btn">查看报表</a>
    </div>

    <table>
      <thead>
        <tr>
          <th>ID/</th>
          <th>客户姓名/</th>
          <th>所属公司/</th>
          <th>状态/</th>
          <th>创建时间/</th>
          <th>操作/</th>
        </tr>
      </thead>
      <tbody id="customerList"></tbody>
    </table>
  </div>

  <!-- 新增/编辑客户弹窗 -->
  <div class="modal" id="customerModal">
    <div class="modal-content">
      <h3 id="modalTitle">新增客户</h3>
      <input type="hidden" id="customerId">
      <div class="form-item">
        <label>客户姓名</label>
        <input type="text" id="name" placeholder="请输入客户姓名">
      </div>
      <div class="form-item">
        <label>手机号</label>
        <input type="text" id="phone" placeholder="请输入手机号">
      </div>
      <div class="form-item">
        <label>邮箱</label>
        <input type="email" id="email" placeholder="请输入邮箱">
      </div>
      <div class="form-item">
        <label>所属公司</label>
        <input type="text" id="company" placeholder="请输入所属公司">
      </div>
      <div class="form-item">
        <label>状态</label>
        <select id="status">
          <option value="active">活跃</option>
          <option value="inactive">非活跃</option>
        </select>
      </div>
      <div class="btn-group">
        <button class="btn" onclick="saveCustomer()">保存</button>
        <button class="btn btn-cancel" onclick="closeModal()">取消</button>
      </div>
    </div>
  </div>

  <script>
    // 解密敏感数据（和后端加密对应）
    function decryptData(data) {
      const key = "mini_crm_secret_key";
      return openssl_decrypt(data, "AES-128-ECB", key);
    }

    // 页面加载时获取用户信息和客户列表
    window.onload = function() {
      const user = JSON.parse(localStorage.getItem("user"));
      if (!user) window.location.href = "login.html";
      document.getElementById("username").textContent = `当前用户：${user.username}`;
      getCustomerList();
    };

    // 获取客户列表
    function getCustomerList() {
      const status = document.getElementById("statusFilter").value;
      const user = JSON.parse(localStorage.getItem("user"));
      fetch(`../api/customers.php?status=${status}&createdBy=${user.id}&page=1&pageSize=10`)
        .then(res => res.json())
        .then(data => {
          const list = data.data.list;
          const tbody = document.getElementById("customerList");
          tbody.innerHTML = "";
          list.forEach(item => {
            const tr = document.createElement("tr");
            tr.innerHTML = `
              <td>${item.id}</td>
              <td>${item.name}</td>
              <td>${item.company || '-'}</td>
              <td>${item.status === 'active' ? '活跃' : '非活跃'}</td>
              <td>${item.created_at}</td>
              <td>
                <button class="btn" style="padding:4px 8px;" onclick="openEditModal(${item.id})">编辑</button>
              </td>
            `;
            tbody.appendChild(tr);
          });
        });
    }

    // 打开新增弹窗
    function openAddModal() {
      document.getElementById("modalTitle").textContent = "新增客户";
      document.getElementById("customerId").value = "";
      document.getElementById("name").value = "";
      document.getElementById("phone").value = "";
      document.getElementById("email").value = "";
      document.getElementById("company").value = "";
      document.getElementById("status").value = "active";
      document.getElementById("customerModal").style.display = "block";
    }

    // 打开编辑弹窗（简化版，实际可补充解密显示手机号/邮箱）
    function openEditModal(id) {
      fetch(`../api/customers.php?id=${id}`) // 实际需补充根据ID查询单个客户的接口，这里简化
        .then(res => res.json())
        .then(data => {
          const item = data.data.list[0];
          document.getElementById("modalTitle").textContent = "编辑客户";
          document.getElementById("customerId").value = item.id;
          document.getElementById("name").value = item.name;
          document.getElementById("phone").value = decryptData(item.phone); // 解密显示
          document.getElementById("email").value = decryptData(item.email); // 解密显示
          document.getElementById("company").value = item.company;
          document.getElementById("status").value = item.status;
          document.getElementById("customerModal").style.display = "block";
        });
    }

    // 关闭弹窗
    function closeModal() {
      document.getElementById("customerModal").style.display = "none";
    }

    // 保存客户（新增/编辑）
    function saveCustomer() {
      const id = document.getElementById("customerId").value;
      const name = document.getElementById("name").value;
      const phone = document.getElementById("phone").value;
      const email = document.getElementById("email").value;
      const company = document.getElementById("company").value;
      const status = document.getElementById("status").value;
      const user = JSON.parse(localStorage.getItem("user"));

      const method = id ? "PUT" : "POST";
      const url = "../api/customer.php";

      fetch(url, {
        method: method,
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          id, name, phone, email, company, status, createdBy: user.id
        })
      })
      .then(res => res.json())
      .then(data => {
        alert(data.msg);
        if (data.code === 200) {
          closeModal();
          getCustomerList();
        }
      });
    }
  </script>
</body>
</html>
