<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>CRM登录 - 迷你版</title>
  <style>
    .login-box { width: 300px; margin: 100px auto; padding: 20px; border: 1px solid #eee; border-radius: 8px; }
    .form-item { margin: 15px 0; }
    input { width: 100%; padding: 8px; box-sizing: border-box; }
    button { width: 100%; padding: 10px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
  </style>
</head>
<body>
  <div class="login-box">
    <h2>CRM系统登录</h2>
    <div class="form-item">
      <label>用户名</label>
      <input type="text" id="username" value="admin" placeholder="请输入用户名">
    </div>
    <div class="form-item">
      <label>密码</label>
      <input type="password" id="password" value="123456" placeholder="请输入密码">
    </div>
    <button onclick="login()">登录</button>
  </div>

  <script>
    function login() {
      const username = document.getElementById("username").value;
      const password = document.getElementById("password").value;

      fetch("../api/login.php", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ username, password })
      })
      .then(res => res.json())
      .then(data => {
        if (data.code === 200) {
          // 存储用户信息到本地，跳转首页
          localStorage.setItem("user", JSON.stringify(data.data));
          window.location.href = "index.html";
        } else {
          alert(data.msg);
        }
      });
    }
  </script>
</body>
</html>
